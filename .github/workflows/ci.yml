name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Compile
        shell: bash
        run: |
          set +e
          rc=0
          for attempt in 1 2 3; do
            ./gradlew --no-daemon classes
            rc=$?
            [ $rc -eq 0 ] && break
            if [ $attempt -lt 3 ]; then
              wait=$((attempt * 30))
              echo "::warning::compile attempt $attempt failed (rc=$rc); retrying in ${wait}s"
              sleep $wait
            fi
          done
          exit $rc
      - name: Run unit tests
        run: ./gradlew --no-daemon test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  validate-resources:
    name: Validate Turtle / scenarios / dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Validate Turtle resources
        run: ./gradlew --no-daemon validateTurtle
      - name: Validate scenario JSON files
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = 'benchmark';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            let bad = 0;
            for (const f of files) {
              const p = path.join(dir, f);
              try {
                let txt = fs.readFileSync(p, 'utf8');
                if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1); // strip UTF-8 BOM
                const data = JSON.parse(txt);
                if (!Array.isArray(data)) throw new Error('top-level is not an array');
                console.log(' OK  ', f, '(', data.length, 'entries)');
              } catch (e) {
                console.error(' FAIL', f, '-', e.message);
                bad++;
              }
            }
            if (bad > 0) { console.error(bad, 'invalid file(s)'); process.exit(1); }
          "
      - name: Validate Phase-1 scenario physics
        run: python3 analysis/validate_phase1_scenarios.py
      - name: Run Python analysis tests
        run: |
          python3 -m pip install pytest numpy
          python3 -m pytest -q analysis/tests
      - name: Enforce exhaustive Phase-1 claim ledger and audit provenance tags
        run: |
          python3 analysis/phase1_claim_ledger_lint.py
          python3 analysis/build_phase1_claim_ledger.py --output /tmp/phase1_claim_ledger.csv
          cmp docs/audit/phase1_claim_ledger.csv /tmp/phase1_claim_ledger.csv
      - name: Phase-1 provenance golden check
        run: python3 analysis/check_provenance.py
      - name: Dashboard Phase-1 data must be a byte-identical derivation
        run: |
          python3 dashboard/scripts/prepare_data.py --only phase1
          git diff --exit-code -- dashboard/public/data/phase1.json
      - name: Build dashboard
        working-directory: dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  preflight-offline:
    name: Preflight (offline, simulator probe skipped)
    runs-on: ubuntu-latest
    needs: [build-test, validate-resources]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run preflight (skip simulator probe)
        run: ./gradlew --no-daemon preflight -Pprofiles=lab1,lab2,lab3 -PskipSimProbe

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Smoke training: end-to-end check that one (profile x stereo) training
  # cell still works under the cross-platform pwsh + Linux runner setup
  # used by the sweep-dev / sweep-paper workflows. Uses dev hyperparameters
  # but only the smallest profile and a single stereo mode (~3-5 min).
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  smoke-training:
    name: Non-inferential smoke (lab1 / stereo=true / v2)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache global npm (node-red)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-noderered-${{ runner.os }}-v4
      - name: Install Node-RED
        run: npm install -g --unsafe-perm node-red@4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run smoke training cell
        shell: pwsh
        run: |
          ./run_full_project.ps1 `
            -RunMode phase1_v2_kg_only `
            -OnlyProfiles lab1 `
            -OnlyStereo true `
            -RunSeed 1 `
            -SkipBenchmark `
            -SkipPreflight
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-phase1-v2-lab1-stereo-true
          path: |
            qtable_final_stereotypes_true_lab1.csv
            metrics_stereotypes_true_lab1.csv
            first_goal_stereotypes_true_lab1.csv
            iv_stats_stereotypes_true_lab1.json
            learned_stereotypes_true_lab1.ttl
            benchmark/results/lab1/training_stereo_true/TRAINING_OK.json
            log/train_lab1_stereo_true.log
            run_full_project.log
          if-no-files-found: warn
          retention-days: 7


